:root{--bg:#fbf8f3;--card:#fff;--ink:#29353e;--sub:#69727a;--accent:#dd6f33;--line:#eadfcf}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:22px 16px}

.info{padding:14px 16px 16px}
.info strong{display:block;font-size:18px}
.info span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.info .go{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:10px}
